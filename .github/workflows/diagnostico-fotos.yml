name: Diagnóstico de fotos (temporário)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          AQUECER_CHAVE: ${{ secrets.AQUECER_CHAVE }}
        run: |
          curl -sS -m 150 -X POST "https://cyxerqtlkhubrkcjqcmx.supabase.co/functions/v1/sss-compras" -H "Content-Type: application/json" -H "x-aquecer-chave: $AQUECER_CHAVE" -d '{"diagnosticoFotos":true}' | jq .
