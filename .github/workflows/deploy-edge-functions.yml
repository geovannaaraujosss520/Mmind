# Publica as Edge Functions (sss-compras e sss-mastermind) no Supabase quando o código muda na branch main.
# Requer o secret do repositório SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Sem o secret, o workflow só avisa e termina sem erro.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cyxerqtlkhubrkcjqcmx
    steps:
      - uses: actions/checkout@v5

      - name: Verificar token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN não configurado — deploy automático desligado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          supabase functions deploy sss-compras --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy sss-mastermind --project-ref "$PROJECT_REF" --no-verify-jwt --yes
